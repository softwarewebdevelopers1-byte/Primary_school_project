<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c9963d" />
    <title>Offline - School Management System</title>
    <style>
      :root {
        color: #223041;
        background: #f7f4ef;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #e6dccd;
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(34, 48, 65, 0.12);
        padding: clamp(24px, 5vw, 44px);
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        object-fit: cover;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5c6672;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      button {
        margin-top: 28px;
        border: 0;
        border-radius: 6px;
        background: #c9963d;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 44px;
        padding: 0 18px;
      }

      button:focus-visible {
        outline: 3px solid rgba(201, 150, 61, 0.35);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="offline-title">
        <img src="/primary_icon.jpeg" alt="" />
        <h1 id="offline-title">You are offline</h1>
        <p>
          The School Management System cannot reach the network right now.
          Check your connection, then try loading this page again.
        </p>
        <button type="button" onclick="window.location.reload()">Try again</button>
      </section>
    </main>
  </body>
</html>
